<div>
  <div class="container mat-elevation-z3">
    <div class="flex-settings-inline">
      <h3 class="m-0">{{ data().label }}</h3>
      <button mat-icon-button class="settings" (click)="showOptions.set(true)">
        <mat-icon>settings</mat-icon>
      </button>
    </div>
    <ng-container [ngComponentOutlet]="data().content"></ng-container>

    @if (showOptions()) {
      <app-widget-options [(showOptions)]="showOptions"></app-widget-options>
    }
  </div>
</div>
